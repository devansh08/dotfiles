[mgr]
ratio = [1, 3, 4]
sort_by = "extension"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "mtime_custom"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = []
title_format = "yazi: {cwd}"

[preview]
wrap = "no"
tab_size = 2
max_width = 1800
max_height = 1800
cache_dir = ""
image_delay = 50
image_filter = "triangle"
image_quality = 90
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', desc = "Edit", block = true, for = "unix" },
]
open = [
  { run = 'hyprctl dispatch exec "[workspace e+0] xdg-open \"$1\""', desc = "Open", for = "linux" },
]
extOpen = [
  { run = 'clear; echo -n "Enter program name: "; read prog; "$prog" "$1"', block = true, desc = "Open with External program", for = "linux" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", for = "linux" },
  { run = '''clear; exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [{ run = 'unp -U "$@"', desc = "Extract here", for = "unix" }]
play = [
  { run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
  { run = '''clear; mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
exec = [{ run = '"$@"', orphan = true, desc = "Run script", for = "linux" }]

[open]
rules = [
  # Folder
  { url = "*/", use = [
    "edit",
    "open",
    "reveal",
  ] },
  # Text
  { mime = "text/*", use = [
    "edit",
    "reveal",
  ] },
  # Image
  { mime = "image/*", use = [
    "open",
    "extOpen",
    "reveal",
  ] },
  # Media
  { mime = "{audio,video}/*", use = [
    "play",
    "extOpen",
    "reveal",
  ] },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
    "extract",
    "reveal",
  ] },
  # Script
  { mime = "text/shellscript", use = [
    "edit",
    "exec",
    "reveal",
  ] },
  # Empty file
  { mime = "inode/empty", use = [
    "edit",
    "reveal",
  ] },
  # Fallback
  { url = "*", use = [
    "open",
    "extOpen",
    "reveal",
  ] },
]

[tasks]
micro_workers = 10
macro_workers = 10
bizarre_retry = 3
image_alloc = 536870912  # 512MB
image_bound = [0, 0]
suppress_preload = false

[plugin]
fetchers = [
  # Mimetype
  { id = "mime", url = "*", run = "mime.local", prio = "high", group = "fetchers" },
  { id = "mime", url = "*/", run = "mime.dir", prio = "high", group = "fetchers" },
]
spotters = [
  { url = "*/", run = "folder", group = "spotters" },
  # Code
  { mime = "text/*", run = "code", group = "spotters" },
  { mime = "application/{mbox,javascript,wine-extension-ini}", run = "code", group = "spotters" },
  # Image
  { mime = "image/{avif,hei?,jxl}", run = "magick", group = "spotters" },
  { mime = "image/svg+xml", run = "svg", group = "spotters" },
  { mime = "image/*", run = "image", group = "spotters" },
  # Video
  { mime = "video/*", run = "video", group = "spotters" },
  # Fallback
  { url = "*", run = "file", group = "spotters" },
]
preloaders = [
  # Image
  { mime = "image/{avif,hei?,jxl}", run = "magick", group = "preloaders" },
  { mime = "image/svg+xml", run = "svg", group = "preloaders" },
  { mime = "image/*", run = "image", group = "preloaders" },
  # PDF
  { mime = "application/pdf", run = "pdf", group = "preloaders" },
  # Font
  { mime = "font/*", run = "font", group = "preloaders" },
  { mime = "application/ms-opentype", run = "font", group = "preloaders" },
]
previewers = [
  { url = "*/", run = "folder", group = "previewers" },
  # Code
  { mime = "text/*", run = "code", group = "previewers" },
  { mime = "application/{mbox,javascript,wine-extension-ini}", run = "code", group = "previewers" },
  # JSON
  { mime = "application/{json,ndjson}", run = "json", group = "previewers" },
  # Image
  { mime = "image/{avif,hei?,jxl}", run = "magick", group = "previewers" },
  { mime = "image/svg+xml", run = "magick", group = "previewers" },
  { mime = "image/*", run = "image", group = "previewers" },
  # Video
  { mime = "video/*", run = "video", group = "previewers" },
  # PDF
  { mime = "application/pdf", run = "pdf", group = "previewers" },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive", group = "previewers" },
  { mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive", group = "previewers" },
  { url = "*.{AppImage,appimage}", run = "archive", group = "previewers" },
  # Virtual Disk / Disk Image
  { mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive", group = "previewers" },
  { mime = "application/virtualbox-{vhd,vhdx}", run = "archive", group = "previewers" },
  { url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive", group = "previewers" },
  # Font
  { mime = "font/*", run = "font", group = "previewers" },
  { mime = "application/ms-opentype", run = "font", group = "previewers" },
  # Empty file
  { mime = "inode/empty", run = "empty", group = "previewers" },
  # Fallback
  { url = "*", run = "file", group = "previewers" },
]

[input]
cursor_blink = false

# cd
cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# create
create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# rename
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# filter
filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

# find
find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# search
search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# shell
shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

[confirm]
# trash
trash_title = "Trash {n} selected file{s}?"
trash_origin = "center"
trash_offset = [0, 0, 70, 20]

# delete
delete_title = "Permanently delete {n} selected file{s}?"
delete_origin = "center"
delete_offset = [0, 0, 70, 20]

# overwrite
overwrite_title = "Overwrite file?"
overwrite_content = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [0, 0, 50, 15]

# quit
quit_title = "Quit?"
quit_content = "The following tasks are still running, are you sure you want to quit?"
quit_origin = "center"
quit_offset = [0, 0, 50, 15]

[pick]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[which]
sort_by = "none"
sort_sensitive = false
sort_reverse = false
sort_translit = false
